<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>You're offline · Applyance</title>
    <style>
      :root { color-scheme: light dark; --bg: #fcfcfc; --fg: #18181b; --muted: #71717a; --primary: #4f46e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141416; --fg: #fafafa; --muted: #a1a1aa; --primary: #6d6af0; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 20px; margin: 16px 0 4px; letter-spacing: -0.01em; }
      p { margin: 0 auto; max-width: 320px; color: var(--muted); }
      button { margin-top: 20px; height: 40px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Applyance needs an internet connection. Your applications keep running on our servers while you're away.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
